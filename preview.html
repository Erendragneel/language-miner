          ? {id:'preview-player-mina',name:'Mina Preview',cloudUserId:'preview-cloud-mina',email:'mina.preview@example.test'}

          app.LANGUAGE_MINER_PREVIEW = true;

          const previewCrystalWallpapers=['moonstone-cathedral','amethyst-crown','emerald-geode','sapphire-ice','sunstone-ember'];
          const previewWallpaperState=previewCrystalWallpapers.includes(previewWallpaper)?{ownedWallpapers:[...new Set([...(existingPreviewState.ownedWallpapers||[]),'midnight',previewWallpaper])],equippedWallpaper:previewWallpaper,colorTheme:'midnight'}:{};
          const previewMineWallpapers=['classic','sakura-grotto','crystal-cathedral','bamboo-tunnel','sunken-mine','magma-forge','aurora-cavern','galaxy-depths','art-azure-passage','art-amethyst-dream','art-moonlit-ice','art-sapphire-river','art-emerald-moss','art-rose-quartz','art-golden-topaz','art-ruby-forge','art-aurora-prism','art-celestial-galaxy','art-opal-hollow','art-ancient-lantern'];
          const previewMineWallpaperState=previewMineWallpapers.includes(previewMineWallpaper)?{ownedMineWallpapers:[...new Set([...(existingPreviewState.ownedMineWallpapers||[]),'classic',previewMineWallpaper])],equippedMineWallpaper:previewMineWallpaper}:{};
          const previewMaxHearts=Math.max(3,Math.min(14,Number(existingPreviewState.maxHearts)||3));
          const previewHeartState=previewParameters.has('hearts')?{maxHearts:previewMaxHearts,hearts:Math.max(0,Math.min(previewMaxHearts,Math.round(Number(previewParameters.get('hearts')))||0))}:{};
          if(previewParameters.get('heartreward')==='ready')previewHeartState.patreonHeartVideoReward={lastClaimedAt:0,lastTier:0,claims:Number(existingPreviewState.patreonHeartVideoReward?.claims)||0};
          app.localStorage.setItem(`jm_profile_${profile.id}`, JSON.stringify({...existingPreviewState,...previewWallpaperState,...previewMineWallpaperState,...previewHeartState,
            onboardingComplete:true,
            placementTestCompleted:true,
            placementRewardClaimed:true,
            placementUnlockedThrough:0,
            selectedStage:0
          }));
          app.loadProfile?.(profile, previewAdmin);
          if(!previewAdmin&&!previewSignedOut){
            const applyPreviewTier=()=>{app.loadProfile?.(profile,false);app.setJapaneseMinerVerifiedSupporterEntitlement?.({tier:previewTier,connected:previewTier>0,source:'preview'});};
            applyPreviewTier();
            const previewTierTimer=app.setInterval(applyPreviewTier,400);
            app.setTimeout(()=>app.clearInterval(previewTierTimer),8000);
          }
          const alphabetMastery = Object.fromEntries('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(letter => [`alphabet:${letter}`, 20]));

              learning:previewLearning,
              placements:{[previewLearning]:'beginner'},
              guides:{[previewLearning]:true},
              progress:{[previewLearning]:{answered:25,correct:25,xp:250,mineXpByMine:{0:250},sectionAnswers:{alphabet:25},courseMastery:alphabetMastery,bossBestByMine:{},bossDefeatedByMine:{},reviewCheckpoints:{},selectedMine:0}}

          app.localStorage.setItem(`lm_multilingual_functional_preview_v1:local:${profile.name}`, previewCourseSettings);
          app.dispatchEvent(new app.CustomEvent('lm-cloud-session-changed'));
          if (previewSignedOut) app.setTimeout(() => app.languageMinerLogout?.(), 1100);
          else if (previewView === 'map') app.setTimeout(() => app.openJapaneseMinerV5?.('map'), 1100);
          else if (previewView === 'parent') app.setTimeout(() => app.openLanguageMinerParentTeacherCenter?.(), 1300);
          else if (previewView === 'wallpapers') {const openWallpaperPreview=()=>{app.document.getElementById('gameMenuBtn')?.click();app.setTimeout(()=>app.document.querySelector('[data-menu-action="shop"]')?.click(),120);app.setTimeout(()=>{const section=app.document.querySelector('[data-mine-cosmetic-section="wallpapers"]');if(section){section.open=true;section.scrollIntoView({block:'start'});}},520);};app.setTimeout(openWallpaperPreview,900);app.setTimeout(openWallpaperPreview,8300);}

          console.error('Preview setup failed', error);
