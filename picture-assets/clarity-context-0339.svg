<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img"><title>A writing panel displays real Japanese hiragana あいうえお and kanji 木山水. It does not print the Japanese answer 日本語.</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#087f8c"/></marker></defs><rect width="600" height="360" rx="24" fill="#f3f9f7"/><rect x="68" y="49" width="464" height="267" rx="14" fill="#fffdf5" stroke="#19354a" stroke-width="3"></rect><text x="300" y="150" font-size="49" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#087f8c" stroke="none">あいうえお</text><text x="300" y="240" font-size="42" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#19354a" stroke="none">木  山  水</text></svg>