<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img"><title>Two equal straight-sided vessels show a 1-to 2 water-volume ratio: the second has exactly twice the first amount.</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#087f8c"/></marker></defs><rect width="600" height="360" rx="24" fill="#f3f9f7"/><rect x="42" y="45" width="228" height="261" rx="16" fill="#fffefa" stroke="#c6dada" stroke-width="3"></rect><rect x="99" y="83" width="114" height="178" rx="0" fill="#edf8fb" stroke="#19354a" stroke-width="3"></rect><rect x="102" y="190" width="108" height="67" rx="0" fill="#78c9e5" stroke="#78c9e5" stroke-width="3"></rect><line x1="102" y1="190" x2="210" y2="190" stroke="#087f8c" stroke-width="4" stroke-linecap="round"></line><rect x="330" y="45" width="228" height="261" rx="16" fill="#fffefa" stroke="#c6dada" stroke-width="3"></rect><rect x="387" y="83" width="114" height="178" rx="0" fill="#edf8fb" stroke="#19354a" stroke-width="3"></rect><rect x="390" y="123" width="108" height="134" rx="0" fill="#78c9e5" stroke="#78c9e5" stroke-width="3"></rect><line x1="390" y1="123" x2="498" y2="123" stroke="#087f8c" stroke-width="4" stroke-linecap="round"></line><line x1="281" y1="181" x2="318" y2="181" stroke="#087f8c" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"></line><text x="300" y="148" font-size="25" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#e69528" stroke="none">×2</text><text x="157" y="336" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#19354a" stroke="none">1</text><text x="443" y="336" font-size="24" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#19354a" stroke="none">2</text></svg>