<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Language Miner</title><style>body{margin:0;background:#101a2c;color:#edf5ff;font:18px/1.6 system-ui;padding:24px}main{max-width:520px;margin:8vh auto;padding:24px;border:1px solid #47617c;border-radius:20px;background:#182a41}h1{font-size:28px}button{font:inherit;font-weight:700;padding:16px;border:0;border-radius:12px;background:#78e0c2;color:#102536;width:100%;cursor:pointer}button:disabled{opacity:.65}small{color:#b9cbe1}</style><main><h1>Update Language Miner</h1><p>Get the illustrated lessons, pronunciation recordings, and beginner learning steps on this phone.</p><p>Your saved progress stays on this device.</p><button id="update">Update and open game</button><p id="status" role="status" aria-live="polite">Version 6.4.209 · Internet connection required</p><small>Keep this page open while the update downloads.</small></main><script>
const button=document.getElementById('update'),status=document.getElementById('status'),base=new URL('../',location.href);
function workerStatus(worker){return new Promise(resolve=>{if(!worker)return resolve(null);const channel=new MessageChannel(),timer=setTimeout(()=>resolve(null),1500);channel.port1.onmessage=e=>{clearTimeout(timer);channel.port1.close();resolve(e.data)};worker.postMessage({type:'LM_GUARDIAN_STATUS'},[channel.port2]);});}
button.onclick=async()=>{button.disabled=true;status.textContent='Downloading the essential update. Pictures and audio will load as you play…';try{if(!('serviceWorker' in navigator))throw Error('Please open this link in Safari or Chrome.');const registration=await navigator.serviceWorker.register(new URL('sw.js',base),{scope:base.href,updateViaCache:'none'});await registration.update();const until=Date.now()+120000;while(Date.now()<until){if(registration.waiting)registration.waiting.postMessage({type:'LM_SKIP_WAITING'});const state=await workerStatus(registration.active);if(state?.buildCache?.startsWith('language-miner-v6.4.209-')&&state.selectedCache===state.buildCache){status.textContent='Update ready. Opening your game…';location.replace(new URL('?release=6.4.209',base));return;}await new Promise(r=>setTimeout(r,500));}throw Error('The download has not finished. Check your connection and try again.');}catch(error){status.textContent=error.message;button.disabled=false;button.textContent='Try update again';}};
</script></html>
